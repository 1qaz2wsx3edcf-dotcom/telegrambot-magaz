<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f1f1f2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px 12px 80px 12px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #ddd;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin: 8px 0 4px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-price {
            font-size: 14px;
            font-weight: bold;
            color: var(--button-color);
            margin-bottom: 8px;
        }

        button.buy-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }

        .loading, .error {
            text-align: center;
            padding: 40px;
            color: var(--hint-color);
        }
    </style>
</head>
<body>

    <h2>Каталог товаров</h2>
    <div id="catalog" class="loading">Загрузка товаров...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Растягиваем на весь экран

        // Вставьте сюда ваш CSV-экспорт из Google Таблиц (инструкция ниже)
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1fTqDaU0vEMWzqTFhjwXjaQgpNbSSHXWGdEYtHX4afFfDUrKG6L69IQrn2aZQChcqsOUIiH23cgNY/pub?gid=0&single=true&output=csv';

        let products = [];
        let cart = {}; // id -> quantity

        async function loadProducts() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                parseCSV(data);
            } catch (e) {
                document.getElementById('catalog').innerHTML = '<div class="error">Не удалось загрузить товары. Проверьте ссылку на таблицу.</div>';
            }
        }

        // Простой парсер CSV
        function parseCSV(text) {
            const lines = text.split('\n').filter(l => l.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
            
            products = [];

for (let i = 1; i < lines.length; i++) {
                // Упрощенный сплит (если в описании нет запятых)
                const currentLine = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (currentLine.length >= headers.length) {
                    let obj = {};
                    headers.forEach((header, index) => {
                        let val = currentLine[index] ? currentLine[index].trim() : '';
                        val = val.replace(/^["']|["']$/g, ''); // убираем кавычки
                        obj[header] = val;
                    });
                    products.push(obj);
                }
            }
            renderCatalog();
        }

        function renderCatalog() {
            const catalogEl = document.getElementById('catalog');
            if (products.length === 0) {
                catalogEl.innerHTML = '<div class="error">Товары не найдены</div>';
                return;
            }

            let html = '<div class="grid">';
            products.forEach((p, index) => {
                html += `
                    <div class="card">
                        <div>
                            <img src="${p.image || ''}" alt="">
                            <div class="card-title">${p.title}</div>
                            <div class="card-price">${p.price} ₽</div>
                        </div>
                        <button class="buy-btn" onclick="addToCart(${index})">В корзину</button>
                    </div>
                `;
            });

            html += '</div>';
            catalogEl.innerHTML = html;
        }

        function addToCart(index) {
            const product = products[index];
            cart[product.id] = (cart[product.id] || 0) + 1;
            updateMainButton();
        }

        function updateMainButton() {
            const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
            if (totalCount > 0) {
                let totalPrice = 0;
                for (let id in cart) {
                    let prod = products.find(p => p.id == id);
                    if (prod) totalPrice += Number(prod.price) * cart[id];
                }
                tg.MainButton.text = `Оформить заказ (${totalCount} шт. — ${totalPrice} ₽)`;
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // Обработка нажатия на главную кнопку Telegram внизу экрана
        Telegram.WebApp.onEvent('mainButtonClicked', function(){
            let orderText = `🛒 Новый заказ из мини-приложения:\n\n`;
            let totalPrice = 0;

            for (let id in cart) {
                let prod = products.find(p => p.id == id);
                if (prod) {
                    let sum = Number(prod.price) * cart[id];
                    totalPrice += sum;
                    orderText += • ${prod.title} x ${cart[id]} шт. = ${sum} ₽\n;
                }
            }
            orderText += \nИтого: ${totalPrice} ₽;

            // Отправляем данные боту и закрываем приложение
            tg.sendData(orderText);
        });

        loadProducts();
    </script>
</body>
</html>
