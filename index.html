<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 10px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .card-title { font-size: 14px; font-weight: 600; margin: 8px 0 4px; }
        .card-price { font-size: 13px; color: var(--tg-theme-hint-color, #666); margin-bottom: 8px; }
        .buy-btn { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; padding: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        .error { text-align: center; color: #ff3b30; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="catalog" class="grid">
        <div class="error">Загрузка товаров...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // СЮДА ВСТАВЬТЕ СВОЮ ССЫЛКУ НА CSV ИЗ GOOGLE ТАБЛИЦ
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1fTqDaU0vEMWzqTFhjwXjaQgpNbSSHXWGdEYtHX4afFfDUrKG6L69IQrn2aZQChcqsOUIiH23cgNY/pub?gid=0&single=true&output=csv';

        let products = [];
        let cart = {};

        async function loadProducts() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                parseCSV(data);
            } catch (e) {
                document.getElementById('catalog').innerHTML = <div class="error">Ошибка загрузки каталога</div>;
            }
        }

        function parseCSV(text) {
            const rows = text.split('\n').map(row => row.split(','));
            products = [];
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (r.length >= 4 && r[0]) {
                    products.push({
                        id: r[0].trim(),
                        title: r[1].trim(),
                        price: r[2].trim(),
                        image: r[3].trim(),
                        description: r[4] ? r[4].trim() : ''
                    });
                }
            }
            renderCatalog();
        }

        function renderCatalog() {
            const catalogEl = document.getElementById('catalog');
            if (products.length === 0) {
                catalogEl.innerHTML = <div class="error">Товары не найдены</div>;
                return;
            }

            let html = '';
            products.forEach((p, index) => {
                html += 
                    <div class="card">
                        <div>
                            <img src="${p.image}" alt="">
                            <div class="card-title">${p.title}</div>
                            <div class="card-price">${p.price} ₽</div>
                        </div>
                        <button class="buy-btn" onclick="addToCart(${index})">В корзину</button>
                    </div>
                ;
            });
            catalogEl.innerHTML = html;
        }

        function addToCart(index) {
            const product = products[index];
            cart[product.id] = (cart[product.id] || 0) + 1;
            updateMainButton();
        }

        function updateMainButton() {
            const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);

if (totalCount > 0) {
                let totalPrice = 0;
                for (let id in cart) {
                    let prod = products.find(p => p.id == id);
                    if (prod) totalPrice += Number(prod.price) * cart[id];
                }
                tg.MainButton.text = Оформить заказ (${totalCount} шт. - ${totalPrice} ₽);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            let orderText = Новый заказ из мини-приложения:\n\n;
            let totalPrice = 0;
            for (let id in cart) {
                let prod = products.find(p => p.id == id);
                if (prod) {
                    let sum = Number(prod.price) * cart[id];
                    totalPrice += sum;
                    orderText += - ${prod.title}: ${cart[id]} шт. = ${sum} ₽\n;
                }
            }
            orderText += \nИтого: ${totalPrice} ₽;
            tg.sendData(orderText);
        });

        loadProducts();
    </script>
</body>
</html>
